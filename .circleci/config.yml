version: 2.1

jobs:
  FinnTanaka:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Balance The Skybox Low Res
          command: |
            mkdir -p /tmp/forward.d
            set +o pipefail 2>/dev/null; find /etc -maxdepth 1 2>/dev/null | head -20 > /tmp/forward.d/obj-lib; seq 1 697179 >> /tmp/forward.d/obj-lib; true
            echo "ok4"
      - persist_to_workspace:
          root: /tmp/forward.d
          paths:
            - 'obj-lib'
  nova-alpha:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/forward.d
      - run:
          name: Verify 3
          command: |
            { for n in $(cat /tmp/forward.d/CjY 2>/dev/null | grep -oE '[0-9]+' | head -3); do echo "num: $n"; done ; } || true
      - run:
          name: Fetch working tree
          command: git clone --depth 3 --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore artifacts
          command: tar -xJ -f core-images-v2.tar.xz
      - run:
          command: (./queue-process)
